<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DamiFit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de móvil, una columna de 640px máx., navegación inferior de 5 pestañas.
   Tokens: ground verde grisáceo, tinta verde oscuro, acento mandarina, hoja verde para estados buenos. */
:root {
  --bg: #F1F5F0;
  --surface: #FFFFFF;
  --surface2: #E6EDE4;
  --ink: #14251D;
  --muted: #566960;
  --line: #D3DCD0;
  --accent: #D9480F;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE3D6;
  --leaf: #1F8A5B;
  --leaf-soft: #D5EEE1;
  --warn: #8F5A00;
  --warn-soft: #F8E8C4;
  --plate: #FCFCF9;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1913;
    --surface: #16251D;
    --surface2: #1F3228;
    --ink: #E8F1EA;
    --muted: #95AB9C;
    --line: #2B4034;
    --accent: #FF8A3D;
    --accent-ink: #1B0F07;
    --accent-soft: #3A2417;
    --leaf: #4CC28A;
    --leaf-soft: #17372A;
    --warn: #E5B65A;
    --warn-soft: #3A2E12;
    --plate: #DDE6DB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1913;
  --surface: #16251D;
  --surface2: #1F3228;
  --ink: #E8F1EA;
  --muted: #95AB9C;
  --line: #2B4034;
  --accent: #FF8A3D;
  --accent-ink: #1B0F07;
  --accent-soft: #3A2417;
  --leaf: #4CC28A;
  --leaf-soft: #17372A;
  --warn: #E5B65A;
  --warn-soft: #3A2E12;
  --plate: #DDE6DB;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding-block: 14px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
.logo b { color: var(--accent); font-weight: 800; }
.logo svg { width: 30px; height: 30px; flex: none; }
.today { text-align: right; font-size: 13px; color: var(--muted); }
.today strong { display: block; color: var(--ink); font-size: 14px; }

/* sections */
.view { display: none; flex-direction: column; gap: 18px; }
.view.on { display: flex; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.banner button { background: none; border: 1px solid currentColor; border-radius: 999px; padding: 5px 12px; font-weight: 600; white-space: nowrap; color: inherit; }

/* meta */
.meta { display: grid; gap: 12px; }
.meta-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.big { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 0.95; letter-spacing: -0.03em; }
.big small { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.bar { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--leaf); border-radius: 999px; transition: width .4s; }
.bar.over > i { background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface2); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
.chip.leaf { background: var(--leaf-soft); color: var(--leaf); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.rowbetween { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13.5px; color: var(--muted); }

/* day pills */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; position: relative; }
.day span { font-size: 11px; font-weight: 500; color: var(--muted); }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day[aria-pressed="true"] span { color: inherit; opacity: .75; }
.day.is-today::after { content: ""; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* meals */
.daytitle { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.meal { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; }
.meal:first-of-type { border-top: 0; }
.plate { width: 84px; height: 84px; border-radius: 18px; background: var(--surface2); display: block; }
.meal h3 { margin: 2px 0 3px; }
.meal p { font-size: 13.5px; color: var(--muted); }
.mealhead { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
.mealhead b { color: var(--accent); font-weight: 700; }

/* logs */
.logrow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.logrow:first-of-type { border-top: 0; }
.logrow .x { background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 8px; }
.empty { color: var(--muted); font-size: 14px; }

/* buttons */
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns > * { flex: 1 1 150px; }

/* challenges */
.task { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.task input { width: 24px; height: 24px; accent-color: var(--leaf); margin: 0; }
.task.done .t { text-decoration: line-through; color: var(--muted); }
.pts { font-size: 12px; font-weight: 700; color: var(--leaf); background: var(--leaf-soft); border-radius: 999px; padding: 2px 8px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 12px; color: var(--muted); }
.dot { width: 100%; aspect-ratio: 1; max-width: 38px; margin: 0 auto 4px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--muted); }
.dot.full { background: var(--leaf); border-color: var(--leaf); color: #fff; }
.dot.part { border-color: var(--leaf); color: var(--leaf); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface2); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 800; }
.stat span { font-size: 12px; color: var(--muted); }

/* exercise */
details.ex { border-top: 1px solid var(--line); padding: 12px 0; }
details.ex:first-of-type { border-top: 0; }
details.ex summary { list-style: none; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; cursor: pointer; }
details.ex summary::-webkit-details-marker { display: none; }
.dayb { width: 40px; height: 40px; border-radius: 12px; background: var(--surface2); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; }
.dayb.rest { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.dayb.t { background: var(--accent); color: var(--accent-ink); }
.exlist { margin: 12px 0 0 52px; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; }
.exlist li { display: flex; justify-content: space-between; gap: 10px; }
.exlist li span { color: var(--muted); text-align: right; }
.donebox { display: flex; align-items: center; gap: 8px; margin: 12px 0 0 52px; font-size: 14px; font-weight: 600; }
.donebox input { width: 22px; height: 22px; accent-color: var(--leaf); margin: 0; }

/* plate analysis */
.drop { border: 2px dashed var(--line); border-radius: 16px; min-height: 190px; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); overflow: hidden; }
.drop img { max-width: 100%; max-height: 320px; border-radius: 12px; display: block; }
.result .big { color: var(--accent); }
.macro { display: grid; grid-template-columns: 90px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13.5px; }
.macro .bar { height: 8px; }
.items { display: grid; gap: 0; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .bar > i { transition: none; } }
.note { font-size: 12.5px; color: var(--muted); }
details.manual summary { cursor: pointer; font-weight: 700; }

/* profile form */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field select { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; min-width: 0; }
.field small { color: var(--muted); font-size: 12px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 10px; }
.chart .ln { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.chart .ar { fill: var(--accent-soft); }
.chart .gr { stroke: var(--line); stroke-width: 1; }
.chart .pt { fill: var(--accent); }

/* nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
nav.tabs div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
nav.tabs button { background: none; border: 0; padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
nav.tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-selected="true"] { color: var(--accent); }

/* recetas, compra, peso */
details.prep { margin-top: 6px; }
details.prep summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 700; }
details.prep p { margin-top: 6px; color: var(--ink); }
.shopgroup { display: grid; gap: 0; }
.shopgroup h3 { margin: 14px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--font-body); }
.shopgroup h3:first-child { margin-top: 0; }
.shop { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.shop input { width: 22px; height: 22px; accent-color: var(--leaf); margin: 0; }
.shop.done .t { text-decoration: line-through; color: var(--muted); }
.back { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; text-align: left; }
.wrow { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.wrow .field { flex: 1 1 130px; }
.delta { font-size: 12.5px; font-weight: 700; }
.delta.dn { color: var(--leaf); }
.delta.up { color: var(--accent); }
</style>

<div class="wrap">
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--ink)" stroke-width="3"/><path d="M9 20c1-7 6-10 14-10-1 8-5 12-12 12-1 0-2-.5-2-2z" fill="var(--accent)"/></svg>

</div>

<nav class="tabs" aria-label="Secciones">

    <button role="tab" data-tab="ej" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>Ejercicio</button>

  </div>
</nav>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var nf = new Intl.NumberFormat("es-ES");
  var nf1 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 1 });
  var DAYS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  var DS = ["L", "M", "X", "J", "V", "S", "D"];

  /* ---------- state ---------- */
  var KEY = "damifit.v1";
  var state = {
    saved: false,
    p: { nombre: "", sexo: "mujer", edad: 30, altura: 165, peso: 70, grasa: "", cuello: "", cintura: "", cadera: "", objetivoPeso: "", nivel: "principiante", actividad: 1.375, meta: "bajar" },
    done: {}, exDone: {}, log: {}, weights: [], shop: {}
  };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); if (o && o.p) { state.saved = !!o.saved; state.p = Object.assign(state.p, o.p); state.done = o.done || {}; state.exDone = o.exDone || {}; state.log = o.log || {}; state.weights = o.weights || []; state.shop = o.shop || {}; } }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  var now = new Date();
  var todayIdx = (now.getDay() + 6) % 7;
  var weekDates = DAYS.map(function (_, i) { var d = new Date(now); d.setDate(now.getDate() - todayIdx + i); return d; });
  var sel = todayIdx;
  var todayISO = iso(now);
  $("#todayLabel").innerHTML = "<strong>" + esc(new Intl.DateTimeFormat("es-ES", { weekday: "long" }).format(now)) + "</strong>" + esc(new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "long" }).format(now));

  /* ---------- calculations ---------- */
  function calc(p) {
    var w = +p.peso || 0, cm = +p.altura || 0, age = +p.edad || 0, h = cm / 100;
    var male = p.sexo === "hombre";
    var bmi = h > 0 ? w / (h * h) : 0;
    var fat = null, fatSrc = "";
    var ne = +p.cuello, wa = +p.cintura, hi = +p.cadera;
    if (p.grasa !== "" && +p.grasa > 3 && +p.grasa < 60) { fat = +p.grasa; fatSrc = "manual"; }
    else if (ne > 0 && wa > ne && cm > 0 && (male || (hi > 0 && wa + hi > ne))) {
      var nv = male ? 495 / (1.0324 - 0.19077 * Math.log10(wa - ne) + 0.15456 * Math.log10(cm)) - 450 : 495 / (1.29579 - 0.35004 * Math.log10(wa + hi - ne) + 0.221 * Math.log10(cm)) - 450;
      if (nv > 3 && nv < 60) { fat = nv; fatSrc = "medidas"; }
    }
    if (fat == null && bmi > 0 && age > 0) { fat = Math.min(55, Math.max(5, 1.2 * bmi + 0.23 * age - 10.8 * (male ? 1 : 0) - 5.4)); fatSrc = "IMC"; }
    if (fat != null) fat = Math.round(fat * 10) / 10;
    var bmr = fat != null && fat > 3 && fat < 60 ? 370 + 21.6 * w * (1 - fat / 100) : 10 * w + 6.25 * cm - 5 * age + (male ? 5 : -161);
    var tdee = bmr * (+p.actividad || 1.375);
    var ideal;
    if (fat != null && fat > 3 && fat < 60) {
      var tf = p.meta === "tonificar" ? (male ? 14 : 21) : (male ? 17 : 24);
      ideal = Math.min(w, (w * (1 - fat / 100)) / (1 - tf / 100));
      if (fat <= tf) ideal = w;
    } else {
      ideal = h * h * (male ? 22 : 21.5);
    }
    var autoIdeal = ideal;
    var ov = p.objetivoPeso === "" ? null : +p.objetivoPeso;
    var target = ov && ov > 25 ? ov : ideal;
    var diff = w - target;
    var low = bmi > 0 && bmi < 18.5;
    var pct = p.meta === "tonificar" ? 0.1 : 0.2;
    if (diff <= 0.5 && p.meta !== "tonificar") pct = 0;
    if (diff <= 0.5 && p.meta === "tonificar") pct = 0.05;
    if (low) pct = 0;
    var floor = male ? 1500 : 1300;
    var kcal = Math.max(floor, Math.round((tdee * (1 - pct)) / 10) * 10);
    if (low) kcal = Math.round(tdee / 10) * 10;
    var deficit = Math.max(0, tdee - kcal);
    var weekly = (deficit * 7) / 7700;
    weekly = Math.min(weekly, w * 0.01);
    var weeks = diff > 0.5 && weekly > 0.02 ? diff / weekly : 0;
    var prot = Math.round(w * (p.meta === "tonificar" ? 1.8 : 1.6));
    var fatg = Math.round((kcal * 0.27) / 9);
    var carb = Math.max(0, Math.round((kcal - prot * 4 - fatg * 9) / 4));
    return { w: w, bmi: bmi, bmr: bmr, tdee: tdee, ideal: target, autoIdeal: autoIdeal, diff: diff, kcal: kcal, deficit: deficit, weekly: weekly, weeks: weeks, prot: prot, fat: fatg, bf: fat, bfSrc: fatSrc, carb: carb, low: low, floor: floor };
  }
  var C = calc(state.p);

  /* ---------- plate illustrations ---------- */
  var ING = {

      '<p class="note">Estimaciones con las fórmulas Mifflin-St Jeor y Katch-McArdle. Son orientativas para adultos sanos y no sustituyen la valoración de un médico o dietista.</p>';
    updRes(); updW();
    el.querySelectorAll("[data-k]").forEach(function (inp) {
      var fn = function () {
        var k = inp.dataset.k, v = inp.value;
        state.p[k] = inp.type === "number" ? (v === "" ? "" : +v) : (k === "actividad" ? +v : v);
        state.saved = true; save(); C = calc(state.p); updRes();
      };
      inp.addEventListener("input", fn); inp.addEventListener("change", fn);
    });
  }
  function fatLabel(b, male) {
    var t = male ? [6, 14, 18, 25] : [14, 21, 25, 32], n = ["grasa esencial", "nivel atlético", "en forma", "promedio", "por encima del promedio"];
    for (var i = 0; i < 4; i++) if (b < t[i]) return n[i];
    return n[4];
  }
  function updRes() {
    var r = $("#pRes"); if (!r) return;
    var s = $("#sugg"); if (s) s.textContent = "Sugerido: " + nf1.format(C.autoIdeal) + " kg";
    var fh = $("#fatHint"); if (fh) fh.textContent = C.bf != null ? "Estimada: " + nf1.format(C.bf) + " % (" + fatLabel(C.bf, state.p.sexo === "hombre") + ", " + (C.bfSrc === "manual" ? "dato tuyo" : C.bfSrc === "medidas" ? "por tus medidas" : "calculada con tu IMC, edad y sexo") + "). Déjalo vacío para que sea automático." : "";
    r.innerHTML = '<div class="eyebrow">Tu resumen</div><div class="stats"><div class="stat"><b class="num">' + nf1.format(C.bmi) + '</b><span>IMC</span></div><div class="stat"><b class="num">' + nf.format(Math.round(C.tdee)) + '</b><span>kcal de gasto</span></div><div class="stat"><b class="num">' + nf.format(C.kcal) + '</b><span>kcal objetivo</span></div></div>' +
      (C.bf != null ? '<div class="chips"><span class="chip leaf num">Grasa corporal ≈ ' + nf1.format(C.bf) + " %</span><span class=\"chip\">" + fatLabel(C.bf, state.p.sexo === "hombre") + "</span><span class=\"chip\">Masa magra ≈ " + nf1.format(C.w * (1 - C.bf / 100)) + " kg</span></div>" : "") +
      '<p>' + (C.diff > 0.5 ? "Te faltan <b>" + nf1.format(C.diff) + " kg</b> para llegar a <b>" + nf1.format(C.ideal) + " kg</b>" + (C.weeks ? ", en unas <b>" + Math.round(C.weeks) + " semanas</b>." : ".") : "Estás en tu peso objetivo de <b>" + nf1.format(C.ideal) + " kg</b>.") + "</p>" +
      (C.low ? '<div class="banner">Tu IMC está por debajo de 18,5. DamiFit no recomienda bajar de peso en este caso. Habla con un profesional sanitario.</div>' : "") +
      '<div class="btns"><button class="btn" id="seePlan">Ver mi plan</button></div>';
    $("#seePlan").onclick = function () { go("plan"); };
  }
  VIEWS.perfil = renderPerfil;

  /* ---------- registro de peso ---------- */
  function wChart(ws) {
    var a = ws.slice(-12), W = 300, H = 90, x0 = 30, mn = Math.min.apply(null, a.map(function (e) { return e.w; })), mx = Math.max.apply(null, a.map(function (e) { return e.w; })), r = Math.max(0.5, mx - mn);
    var pts = a.map(function (e, i) { return [x0 + ((W - x0 - 6) * (a.length === 1 ? 0 : i)) / Math.max(1, a.length - 1), 10 + (H - 20) * (1 - (e.w - mn) / r)]; });
    var line = pts.map(function (q, k) { return (k ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("");
    return '<svg class="chart" viewBox="0 0 ' + W + " " + (H + 22) + '" role="img" aria-label="Evolución de tu peso"><path class="gr" d="M' + x0 + " 10H" + (W - 6) + "M" + x0 + " " + (H - 10) + "H" + (W - 6) + '"/><path class="ln" d="' + line + '"/>' + pts.map(function (q) { return '<circle class="pt" cx="' + q[0] + '" cy="' + q[1] + '" r="3.5"/>'; }).join("") + '<text x="' + (x0 - 5) + '" y="14" text-anchor="end">' + nf1.format(mx) + '</text><text x="' + (x0 - 5) + '" y="' + (H - 6) + '" text-anchor="end">' + nf1.format(mn) + '</text><text x="' + x0 + '" y="' + (H + 16) + '">' + esc(a[0].d.slice(8) + "/" + a[0].d.slice(5, 7)) + '</text><text x="' + (W - 6) + '" y="' + (H + 16) + '" text-anchor="end">' + esc(a[a.length - 1].d.slice(8) + "/" + a[a.length - 1].d.slice(5, 7)) + "</text></svg>";
  }
  function updW() {
    var box = $("#wlog"); if (!box) return;
    var ws = state.weights.slice().sort(function (a, b) { return a.d < b.d ? -1 : 1; });
    var last = ws[ws.length - 1], ago = last ? Math.round((new Date(todayISO) - new Date(last.d)) / 86400000) : null;
    var h = '<div><div class="eyebrow">Seguimiento semanal</div><h3>Registro de peso</h3></div><div class="wrow"><div class="field"><label for="wIn">Peso de hoy (kg)</label><input id="wIn" type="number" inputmode="decimal" step="0.1" min="35" max="250" value="' + esc(state.p.peso) + '"></div><button class="btn" id="wSave" style="flex:1 1 130px">Guardar peso</button></div>';
    h += '<p class="note">' + (last ? "Último registro hace " + (ago === 0 ? "menos de un día" : ago + (ago === 1 ? " día" : " días")) + ". " : "") + "Pésate una vez por semana, a la misma hora y en ayunas, para ver la tendencia real.</p>";
    if (ws.length >= 2) h += wChart(ws);
    if (ws.length) {
      h += "<div>" + ws.slice().reverse().slice(0, 8).map(function (e) {
        var i = ws.indexOf(e), dl = i > 0 ? e.w - ws[i - 1].w : null;
        return '<div class="logrow"><span>' + esc(new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "short" }).format(new Date(e.d + "T12:00:00"))) + '</span><span class="num"><b>' + nf1.format(e.w) + ' kg</b> ' + (dl == null || Math.abs(dl) < 0.05 ? "" : '<span class="delta ' + (dl < 0 ? "dn" : "up") + '">' + (dl > 0 ? "+" : "") + nf1.format(dl) + "</span>") + '<button class="x" data-wd="' + e.d + '" aria-label="Borrar registro">×</button></span></div>';
      }).join("") + "</div>";
    }
    box.innerHTML = h;
    $("#wSave").onclick = function () {
      var v = parseFloat($("#wIn").value);
      if (!(v >= 35 && v <= 250)) { $("#wIn").focus(); return; }
      state.weights = state.weights.filter(function (e) { return e.d !== todayISO; });
      state.weights.push({ d: todayISO, w: v });
      state.p.peso = v; state.saved = true; save(); C = calc(state.p);
      var fp = $("#f-peso"); if (fp) fp.value = v;
      updRes(); updW();
    };
    box.querySelectorAll("[data-wd]").forEach(function (x) { x.onclick = function () { state.weights = state.weights.filter(function (e) { return e.d !== x.dataset.wd; }); save(); updW(); }; });
  }

  /* ---------- lista de la compra ---------- */
  function shopTotals() {
    var t = {};
    MENU.forEach(function (day) { day.forEach(function (m) { m[3].forEach(function (k) { if (SHOPDEF[k]) t[k] = (t[k] || 0) + SHOPDEF[k][2]; }); }); });
    return t;
  }
  function fmtQty(v, u) {
    if (u === "g") return v >= 1000 ? nf1.format(v / 1000) + " kg" : nf.format(Math.round(v / 10) * 10) + " g";
    if (u === "lata") return Math.round(v) + (Math.round(v) === 1 ? " lata" : " latas");
    return nf1.format(Math.ceil(v)) + " ud";
  }
  function renderShop() {
    var el = $("#v-shop"), t = shopTotals(), cats = ["Carne y pescado", "Fruta y verdura", "Despensa", "Lácteos"], total = Object.keys(t).length, got = Object.keys(t).filter(function (k) { return state.shop[k]; }).length;
    var h = '<button class="back" id="shBack">← Volver al plan</button><div><div class="eyebrow">Para 1 persona · 7 días</div><h2>Lista de la compra</h2></div>';
    h += '<div class="rowbetween"><span class="num">' + got + " de " + total + ' en el carro</span></div><div class="bar" role="progressbar" aria-valuenow="' + Math.round((got / total) * 100) + '" aria-valuemin="0" aria-valuemax="100" aria-label="Compra completada"><i style="width:' + Math.round((got / total) * 100) + '%"></i></div>';
    h += '<div class="card shopgroup">';
    cats.forEach(function (c) {
      h += "<h3>" + c + "</h3>";
      Object.keys(t).filter(function (k) { return SHOPDEF[k][1] === c; }).forEach(function (k) {
        var on = !!state.shop[k];
        h += '<label class="shop' + (on ? " done" : "") + '"><input type="checkbox" data-s="' + k + '"' + (on ? " checked" : "") + '><span class="t">' + esc(SHOPDEF[k][0]) + '</span><b class="num">' + fmtQty(t[k], SHOPDEF[k][3]) + "</b></label>";
      });
    });
    h += '</div><p class="note">Cantidades aproximadas del menú base. Ten a mano aceite de oliva, sal, especias y vinagre. Si tus raciones son más grandes o pequeñas, ajusta la compra.</p><div class="btns"><button class="btn ghost" id="shReset">Vaciar el carro</button></div>';
    el.innerHTML = h;
    $("#shBack").onclick = function () { go("plan"); };
    $("#shReset").onclick = function () { state.shop = {}; save(); renderShop(); };
    el.querySelectorAll("input[data-s]").forEach(function (i) { i.onchange = function () { if (i.checked) state.shop[i.dataset.s] = true; else delete state.shop[i.dataset.s]; save(); renderShop(); }; });
  }

  /* ---------- init ---------- */
  function setStatus() {
    var s = $("#aiStatus"); if (!s) return;
    s.textContent = sampleFn && canImg ? "Análisis por foto disponible. Al analizar, Claude te pedirá permiso la primera vez." : sampleFn ? "En esta vista no se pueden enviar fotos a Claude. Describe tu plato con palabras en el recuadro de abajo." : "Claude no está disponible en esta vista. Usa «Calcular a mano» más abajo.";
  }
  setTimeout(function () { if (!sampleFn) setStatus(); }, 4000);
  renderPlan();
  (function () {
    if (!window.claude || !window.claude.use) return;
    window.claude.use("sample").then(function (s) {
      if (!s) return;
      sampleFn = s;
      return s.limits().then(function (l) { canImg = !!(l && l.images); }).catch(function () { canImg = false; });
    }).then(setStatus).catch(setStatus);
  })();
})();
</script>

</body></html>
